name: Daily Crawl

# 毎日 JST 6:00 (UTC 21:00 前日) に実行 + 手動実行可
on:
  schedule:
    - cron: '0 21 * * *'  # 21:00 UTC = 06:00 JST
  workflow_dispatch:       # 手動トリガー

permissions:
  contents: write          # data/catches.jsonへの書き込み権限

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: crawler/package.json

      - name: Install crawler deps
        working-directory: crawler
        run: npm install

      - name: Run crawler
        working-directory: crawler
        run: npm run crawl

      - name: Commit updated catches.json
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          if git diff --quiet data/catches.json; then
            echo "No changes to commit"
          else
            git add data/catches.json
            git commit -m "chore: update catches data $(date +%Y-%m-%d)"
            git push
          fi
